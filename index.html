<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy – Simulated Alexa+ Study Planner</title>
<style>
:root{--bg:#0f1b2d;--card:#18283f;--acc:#00caff;--tx:#eaf2ff;--mut:#8ea3c0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:16px 20px;font-size:20px;font-weight:700}header span{color:var(--acc)}
main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px 14px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;padding:14px;min-height:120px}
h2{margin:0 0 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
#log{height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.u{align-self:flex-end;background:#2a4a75}.a{align-self:flex-start;background:#0b3b4d;border:1px solid var(--acc)}
.row{display:flex;gap:8px;margin-top:10px}input{flex:1;padding:10px;border-radius:10px;border:0;background:#0f1b2d;color:var(--tx)}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--acc);color:#001;font-weight:700;cursor:pointer}
.chips button{background:#223a5a;color:var(--tx);font-weight:400;margin:4px 4px 0 0;font-size:12px}
.t{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #243a58}
.done{text-decoration:line-through;color:var(--mut)}.od{color:#ff7b7b}
pre{margin:0;font-size:12px;color:#9be7ff;white-space:pre-wrap;max-height:160px;overflow:auto}
</style></head><body>
<header>🔵 StudyBuddy <span>for Alexa+</span> <small style="color:var(--mut);font-weight:400">(simulated)</small></header>
<main>
<section class="card"><h2>Talk to Alexa+</h2><div id="log"></div>
<div class="row"><button id="mic" title="Speak">🎤</button><input id="in" placeholder='Try: "add Python quiz due Friday"'><button id="go">Send</button></div>
<div class="chips" id="chips"></div></section>
<section><div class="card"><h2>My assignments</h2><div id="tasks"></div></div>
<div class="card" style="margin-top:14px"><h2>Agent tool calls (MCP-style)</h2><pre id="trace">—</pre></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
let tasks=JSON.parse(localStorage.getItem('sb_tasks')||'[]');
const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const nice=s=>new Date(s+'T00:00').toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'short'});
function parseDate(t){let d=today(),m;
 if(/\btoday\b/.test(t));
 else if(/\btomorrow\b/.test(t))d.setDate(d.getDate()+1);
 else if(m=t.match(/in (\d+) days?/))d.setDate(d.getDate()+ +m[1]);
 else if(m=t.match(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))d.setDate(d.getDate()+((DAYS.indexOf(m[1])-d.getDay()+7)%7||7));
 else if(m=t.match(/(\d{4}-\d{2}-\d{2})/))d=new Date(m[1]+'T00:00');
 else return null;
 return fmt(d)}
const find=q=>tasks.find(t=>t.title.toLowerCase().includes(q.toLowerCase().trim()));
const save=()=>{localStorage.setItem('sb_tasks',JSON.stringify(tasks));render()};
// ---- Tools (what an MCP server would expose to Alexa+) ----
const tools={
 add_task({title,due}){tasks.push({title,due,done:false});save();return `Done. I added "${title}"`+(due?`, due ${nice(due)}.`:'.')},
 list_tasks(){const p=tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1);
  if(!p.length)return "You have nothing pending. Nice work!";
  return `You have ${p.length} pending:\n`+p.map(t=>`• ${t.title}`+(t.due?` – ${nice(t.due)}`:'')).join('\n')},
 complete_task({q}){const t=find(q);if(!t)return `I couldn't find "${q}".`;t.done=true;save();return `Great job! "${t.title}" is marked done.`},
 delete_task({q}){const t=find(q);if(!t)return `I couldn't find "${q}".`;tasks=tasks.filter(x=>x!==t);save();return `Removed "${t.title}".`},
 plan_week(){const p=tasks.filter(t=>!t.done&&t.due).sort((a,b)=>a.due>b.due?1:-1);
  if(!p.length)return "Add some assignments with due dates and I'll plan your week.";
  const now=fmt(today());
  return "Here's your study plan (1 hour each):\n"+p.map(t=>{const d=new Date(t.due+'T00:00');d.setDate(d.getDate()-1);
   const s=fmt(d)<now?now:fmt(d);return `• ${nice(s)}: study "${t.title}"`+(t.due<now?' ⚠ overdue!':'')}).join('\n')}
};
// ---- Intent parsing (stands in for Alexa+'s language understanding) ----
function understand(raw){const t=raw.toLowerCase().trim();let m;
 if(/\bplan\b/.test(t))return['plan_week',{}];
 if(m=t.match(/^(?:mark |i )?(?:finished|completed?|done(?: with)?)\s+(.+)/))return['complete_task',{q:m[1].replace(/\s+as done$/,'')}];
 if(m=t.match(/^mark (.+?) (?:as )?(?:done|complete)/))return['complete_task',{q:m[1]}];
 if(m=t.match(/^(?:delete|remove)\s+(.+)/))return['delete_task',{q:m[1]}];
 if(/(what|show|list|read).*(due|tasks?|assignments?|homework|pending)/.test(t))return['list_tasks',{}];
 if(m=t.match(/^(?:add|create|remind me to|remind me)\s+(?:an? )?(?:assignment |task )?(.+)/)){
  let title=m[1].split(/\s+(?:due|by|on|for)\s+/)[0].trim();
  return['add_task',{title:title.charAt(0).toUpperCase()+title.slice(1),due:parseDate(t)}]}
 return null}
function say(txt,who){const d=document.createElement('div');d.className='m '+who;d.textContent=txt;$('#log').append(d);$('#log').scrollTop=1e9;
 if(who==='a'&&window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(txt.replace(/[•⚠]/g,'')))}}
function handle(raw){if(!raw.trim())return;say(raw,'u');
 const r=understand(raw);
 if(!r){$('#trace').textContent='no tool matched';return say("Sorry, I didn't catch that. Try \"add Python quiz due Friday\", \"what's due\", \"plan my week\", or \"finished Python quiz\".",'a')}
 $('#trace').textContent=`tools/call → ${r[0]}(${JSON.stringify(r[1])})`;
 say(tools[r[0]](r[1]),'a')}
function render(){$('#tasks').innerHTML=tasks.length?'':'<span style="color:var(--mut)">Nothing yet.</span>';
 tasks.forEach(t=>{const e=document.createElement('div');e.className='t';
  const od=!t.done&&t.due&&t.due<fmt(today());
  e.innerHTML=`<span class="${t.done?'done':''}"></span><span class="${od?'od':''}" style="color:var(--mut)"></span>`;
  e.children[0].textContent=t.title;e.children[1].textContent=t.due?nice(t.due):'';$('#tasks').append(e)})}
$('#go').onclick=()=>{handle($('#in').value);$('#in').value=''};
$('#in').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const r=new SR();r.lang='en-US';r.onresult=e=>handle(e.results[0][0].transcript);$('#mic').onclick=()=>r.start()}else $('#mic').style.display='none';
['add Python quiz due Friday','add C++ assignment due in 3 days','what\'s due','plan my week','finished Python quiz'].forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>handle(s);$('#chips').append(b)});
render();say("Hi, I'm Alexa+ with the StudyBuddy skill. Tell me about your assignments!",'a');
</script></body></html>
